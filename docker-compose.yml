
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: 5

x-env: &env
  env_file:
    - .env

services:
  postgres:
    image: postgres:17-alpine
    <<: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bot-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kita}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    <<: *logging
    volumes:
      - redis_data:/data
    networks:
      - bot-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    <<: [*logging, *env]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot-internal
      - kita-proxy
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    secrets:
      - tg_token
      - encryption_key
      - webhook_secret
    restart: unless-stopped

secrets:
  tg_token:
    file: ./secrets/.tg_token
  webhook_secret:
    file: ./secrets/.webhook_secret
  encryption_key:
    file: ./secrets/.encryption_key

volumes:
  pgdata:
  redis_data:

networks:
  bot-internal:
    driver: bridge

  kita-proxy:
    name: kita-proxy
    driver: bridge
    external: true
