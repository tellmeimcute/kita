
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: 3

x-env: &env
  env_file:
    - .env

services:
  postgres:
    image: postgres:17-alpine
    <<: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bot-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kita}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    <<: *logging
    volumes:
      - redis_data:/data
    networks:
      - bot-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: .
    <<: [*logging, *env]
    entrypoint: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bot-internal
    environment:
      POSTGRES_HOST: postgres
    secrets:
      - tg_token
      - encryption_key
      - webhook_secret
    restart: "no"

  bot:
    build: .
    <<: [*logging, *env]
    entrypoint: ["uv", "run", "uvicorn", "main:application", "--host", "0.0.0.0", "--port", "5000", "--factory", "--app-dir", "src"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - bot-internal
      - kita-proxy
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    secrets:
      - tg_token
      - encryption_key
      - webhook_secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    <<: [*logging, *env]
    entrypoint: ["uv", "run", "taskiq", "worker", "task_queue.worker:worker", "-d", "src", "task_queue.tasks", "-w", "1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - bot-internal
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    secrets:
      - tg_token
      - encryption_key
      - webhook_secret
    restart: unless-stopped

secrets:
  tg_token:
    file: ./secrets/.tg_token
  webhook_secret:
    file: ./secrets/.webhook_secret
  encryption_key:
    file: ./secrets/.encryption_key

volumes:
  pgdata:
  redis_data:

networks:
  bot-internal:
    driver: bridge

  kita-proxy:
    name: kita-proxy
    external: true
