
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: 5

x-env: &env
  env_file:
    - .env

services:
  postgres:
    image: postgres:17-alpine
    <<: [*logging, *env]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bot-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kita}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    <<: *logging
    volumes:
      - redis_data:/data
    networks:
      - bot-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    <<: [*logging, *env]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot-internal
      - kita-proxy
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:

networks:
  bot-internal:
    driver: bridge

  kita-proxy:
    name: kita-proxy
    driver: bridge
    external: true
