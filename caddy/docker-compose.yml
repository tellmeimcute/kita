
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "${WEBHOOK_PORT}:${WEBHOOK_PORT}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - WEBHOOK_PORT=${WEBHOOK_PORT}
      - WEBHOOK_PATH=${WEBHOOK_PATH}
      - BOT_PORT=${BOT_PORT}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    networks:
      - kita-proxy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  kita-proxy:
    external: true